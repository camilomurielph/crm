{% extends 'base.html' %}
{% block title %}Nuevo Proyecto - Actols CRM{% endblock %}
{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h2 class="form-title"><i class="fas fa-diagram-project"></i> Nuevo Proyecto</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-fields">
                <p>
                    <label for="cliente">Cliente (opcional)</label>
                    <select name="cliente" id="cliente">
                        <option value="">Sin asignar</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.id }}" {% if request.GET.cliente == cliente.id|stringformat:"s" %}selected{% endif %}>
                                {{ cliente.razon_social|default:cliente.nombre_comercial|default:"Cliente sin nombre" }}
                            </option>
                        {% endfor %}
                    </select>
                </p>
                {{ form.as_p }}
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'core:proyectos' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
