{% extends 'base.html' %}
{% block title %}Editar Enlace - Actols CRM{% endblock %}
{% block content %}
<h2>Editar Enlace</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'core:enlaces' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
