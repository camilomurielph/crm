{% extends 'base.html' %}
{% block title %}Editar Tarea - Actols CRM{% endblock %}
{% block content %}
<h2>Editar Tarea</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'core:tarea_detalle' tarea.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
