{% extends 'base.html' %}
{% block title %}Iniciar Sesión - Actols CRM{% endblock %}
{% block menu %}{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h3>Actols CRM</h3>
        <form method="post">
            {% csrf_token %}
            <div class="form-fields">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3" style="padding: 0.7rem; border-radius: 12px;">
                Iniciar Sesión
            </button>
        </form>
        {% if form.errors %}
            <div class="alert alert-danger mt-3" style="background-color: #3a1a1a; border-color: #5a2020; color: #ffbdbd;">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
